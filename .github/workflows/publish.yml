name: Publish mod to platforms

on:
  push:
    branches: [stonecutter]
  workflow_dispatch:
    inputs:
      modrinth:
        description: Publish to Modrinth
        type: boolean
        default: true
      curseforge:
        description: Publish to CurseForge
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    name: Generate changelog
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Create release
        uses: ncipollo/release-action@v1.20.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ github.ref_name }}
          token: ${{ github.token }}
          tag: latest
          generateReleaseNotes: true
      - name: Generate changelog
        uses: smichard/conventional_changelog@2.0.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changelog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "docs: update generated changelog" || echo "No changes to commit"
          git push

  curseforge:
    name: CurseForge publish
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[cf]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.curseforge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'
      - name: Validate CurseForge credentials
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: test -n "$CURSEFORGE_TOKEN" || { echo '::error::CURSEFORGE_TOKEN is not configured'; exit 1; }
      - name: Publish to CurseForge
        run: gradle publishMods --no-parallel --stacktrace
        env:
          CURSEFORGE_ID: ${{ secrets.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

  modrinth:
    name: Modrinth publish
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[mr]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.modrinth)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'
      - name: Validate Modrinth credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: test -n "$MODRINTH_TOKEN" || { echo '::error::MODRINTH_TOKEN is not configured'; exit 1; }
      - name: Publish to Modrinth
        run: gradle publishMods --no-parallel --stacktrace
        env:
          MODRINTH_ID: tdrqr7qS
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
